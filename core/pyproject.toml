[project]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS cloud assistant core built on Pydantic AI and Pydantic AI Harness"
requires-python = ">=3.12"
dependencies = [
    # Exact pins: the Firestore stores reuse Harness serialization helpers that
    # are not public API; the contract tests catch any change on upgrade.
    "pydantic-ai-slim[google,openai,typesafe,web-fetch]==2.50.0",
    "pydantic-ai-harness==0.35.0",
    "google-cloud-firestore>=2.32,<3",
    "google-cloud-secret-manager>=2.30,<3",
    "fastapi>=0.141,<1",
    "uvicorn>=0.54,<1",
    "google-cloud-tasks>=2.25,<3",
    "google-auth[requests]>=2.58,<3",
    "anyio>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
