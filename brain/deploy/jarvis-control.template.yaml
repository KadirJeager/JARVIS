# Template only: fill in the verified image, proxy model, service identity,
# Chat audience/user and three new control secrets before deployment.
# The existing CLIProxyAPI image and its two existing secrets are reused.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: jarvis-control
  namespace: '000000000000'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/container-dependencies: '{"control":["llm-proxy"]}'
    spec:
      containerConcurrency: 40
      serviceAccountName: REPLACE_WITH_CONTROL_SERVICE_ACCOUNT
      timeoutSeconds: 300
      containers:
      - name: control
        image: REPLACE_WITH_BUILT_THIN_CONTROL_IMAGE
        ports:
        - containerPort: 8080
          name: http1
        env:
        - name: JARVIS_OWNER_ID
          value: kadir
        - name: JARVIS_HERMES_UPSTREAM_BASE_URL
          value: http://localhost:8317
        - name: JARVIS_HERMES_UPSTREAM_MODEL
          value: REPLACE_WITH_VERIFIED_PROXY_MODEL
        - name: JARVIS_HERMES_UPSTREAM_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: cliproxy-api-key
        - name: JARVIS_HERMES_TOKEN
          valueFrom:
            secretKeyRef:
              key: latest
              name: jarvis-hermes-token
        - name: JARVIS_WORKER_TOKEN
          valueFrom:
            secretKeyRef:
              key: latest
              name: jarvis-worker-token
        - name: JARVIS_INGEST_TOKEN
          valueFrom:
            secretKeyRef:
              key: latest
              name: jarvis-ingest-token
        # Add JARVIS_CHAT_AUDIENCE, JARVIS_CHAT_ALLOWED_USER,
        # JARVIS_CHAT_MANAGER_KIND, JARVIS_CHAT_EVENT_FORMAT=workspace_addon,
        # and the add-on's JARVIS_CHAT_SERVICE_ACCOUNT after the HTTP endpoint
        # and its project service account are confirmed in Chat settings.
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
          failureThreshold: 12
      - name: llm-proxy
        image: gcr.io/your-gcp-project/jarvis-llm-proxy:v7.2.111
        env:
        - name: CLIPROXY_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: cliproxy-api-key
        volumeMounts:
        - name: oauth-auth
          mountPath: /secrets/auth
          readOnly: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          tcpSocket:
            port: 8317
          periodSeconds: 5
          failureThreshold: 12
      volumes:
      - name: oauth-auth
        secret:
          secretName: cliproxy-oauth-antigravity
          items:
          - key: latest
            path: antigravity.json
  traffic:
  - percent: 100
    latestRevision: true
