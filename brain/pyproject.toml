[project]
name = "jarvis-brain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.16,<2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-cloud-firestore>=2.16",
    "google-auth>=2.30",
    "google-genai>=1.0",
    # Memory embeddings are a CORE feature (app/memory.py), so
    # sentence-transformers lives here, not in the speaker extra. It needs
    # torch, but torch deliberately stays in the speaker extra: the
    # Dockerfile installs torch FIRST from the CPU wheel index (PyPI's
    # default wheel is multi-GB CUDA), so by the time ".[speaker]" resolves
    # this dep the torch pin is already satisfied. Installing the base
    # package WITHOUT that CPU-torch-first step would pull the CUDA wheel.
    "sentence-transformers>=3.0",
    # Misafir Kapısı (app/guest_gate.py, North Star §4.9): FastMCP streamable
    # HTTP transport. 1.28.1 API'si kaynaktan doğrulandı (streamable_http_app,
    # stateless_http, TransportSecuritySettings).
    "mcp>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
speaker = ["speechbrain>=1.0", "torch>=2.2", "torchaudio>=2.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
