[versions]
agp = "9.3.0"
kotlin = "2.4.10"
coreKtx = "1.16.0"
activityCompose = "1.12.0"
composeBom = "2026.06.01"
retrofit = "3.0.0"
okhttp = "5.4.0"
kotlinxSerialization = "1.11.0"
credentials = "1.6.0"
googleid = "1.2.0"
datastore = "1.2.1"
# 2.11.0 needs compileSdk 37; 2.10.0 needs minCompileSdk 35 → fits our compileSdk 36.
lifecycle = "2.10.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"
# 1.1.0 is the latest STABLE; the 1.2.0/1.4.0 lines are alpha only.
# Brings androidx.fragment (compile) — required, BiometricPrompt only accepts a
# FragmentActivity — and androidx.appcompat (runtime). The appcompat pull-in is
# expected, not a misconfiguration.
biometric = "1.1.0"
# Push (Faz Y3). Both are the newest releases at the time of writing, chosen because the
# google-services plugin has to understand AGP 9.3.0's build model — an older line of the
# plugin predates AGP 9 entirely. The BOM pins firebase-messaging (34.17.0 -> 25.1.1), so
# the messaging artifact carries NO version of its own: one place decides, always.
googleServices = "4.5.0"
firebaseBom = "34.17.0"
# Stable line only (1.7.0-alpha07 is the current alpha, excluded on purpose).
wearCompose = "1.6.2"
playServicesWearable = "20.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.6.1" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
# No version on purpose — the BOM above supplies it.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
# Same release train as "coroutines" (1.11.0 confirmed the latest stable on maven-metadata.xml
# for this artifact at the time of writing) — Tasks.await() interop for NodeClient/MessageClient.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

[plugins]
# AGP 9.x has built-in Kotlin support — the org.jetbrains.kotlin.android plugin is
# no longer applied. KGP is raised to `kotlin` (2.4.10) via a buildscript classpath in
# the root build so the built-in Kotlin compiler matches the Compose compiler plugin.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Turns app/google-services.json into the resources FirebaseApp reads at init. Without it
# FirebaseMessaging.getInstance() throws at runtime even though the JSON is in the tree —
# which is exactly the state this module was in before Faz Y3.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
