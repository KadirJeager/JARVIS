# Build must run on JDK 21 (AGP 9.x); system default JDK 26 is NOT compatible.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Wear W1 pairing contract (Task 4 review fix, spec §5): the ONE literal for the
# phone->watch device-token message path. :app's WatchPairing and :wear's
# TokenListenerService both read this exact value via their module's generated
# BuildConfig (see each module's buildConfigField in build.gradle.kts) instead of each
# hand-typing its own copy of the string -- :app and :wear are separate, non-dependent
# Gradle modules (separate APKs, separate devices) and must not depend on each other
# directly, so this property is the single shared source both sides read from.
jarvis.wearDeviceTokenMessagePath=/jarvis/device-token
